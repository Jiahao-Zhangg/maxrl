# Paths are supplied by grpo_release_benchmark.prepare from a recorded plan.
data:
  train_batch_size: 32
  val_batch_size: 1
  max_prompt_length: 3072
  max_response_length: 32768
  shuffle: true
  seed: 42
  dataloader_num_workers: 4
  filter_overlong_prompts: true
  filter_overlong_prompts_workers: 1
  truncation: error
  apply_chat_template_kwargs:
    enable_thinking: true

actor_rollout_ref:
  hybrid_engine: true
  model:
    enable_gradient_checkpointing: true
    enable_activation_offload: false
    use_remove_padding: true
    use_liger: false
    use_fused_kernels: false
  actor:
    strategy: fsdp
    ppo_mini_batch_size: 32
    ppo_micro_batch_size_per_gpu: 1
    use_dynamic_bsz: false
    ppo_max_token_len_per_gpu: 35840
    grad_clip: 0.3
    entropy_coeff: 0
    # The old launcher skips entropy during actor updates when its coefficient
    # is zero. The separate old-log-prob pass still reports policy entropy.
    calculate_entropy: false
    use_kl_loss: false
    kl_loss_coef: 0
    use_torch_compile: true
    entropy_from_logits_with_chunking: true
    entropy_checkpointing: true
    ppo_epochs: 1
    shuffle: false
    optim:
      lr: 1.0e-6
      weight_decay: 0.01
      clip_grad: 0.3
      lr_scheduler_type: constant
    fsdp_config:
      param_offload: false
      optimizer_offload: false
      offload_policy: false
      use_torch_compile: true
      ulysses_sequence_parallel_size: 1
  rollout:
    name: vllm
    mode: async
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    n: 8
    seed: 42
    dtype: bfloat16
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.7
    max_model_len: 35840
    max_num_batched_tokens: 8192
    max_num_seqs: 16
    enforce_eager: false
    cudagraph_capture_sizes: [1, 2, 4, 8, 16]
    enable_chunked_prefill: true
    enable_prefix_caching: true
    free_cache_engine: true
    calculate_log_probs: false
    log_prob_micro_batch_size_per_gpu: 1
    log_prob_use_dynamic_bsz: false
    log_prob_max_token_len_per_gpu: 35840
    disable_log_stats: false
    engine_kwargs:
      vllm:
        async_scheduling: true
        attention_config:
          backend: FLASH_ATTN
          flash_attn_version: 3
        compilation_config:
          cudagraph_mode: FULL_AND_PIECEWISE
    agent:
      num_workers: 8

algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: true
  use_kl_in_reward: false
  kl_ctrl:
    kl_coef: 0

reward:
  num_workers: 8
  custom_reward_function:
    name: compute_score
    reward_kwargs:
      workers_per_process: 16

trainer:
  use_v1: true
  v1:
    trainer_mode: sync
  total_epochs: 1
  total_training_steps: 1
  logger: [console]
  project_name: Qwen3_MaxRL_Experiments
  experiment_name: grpo_verl091_vllm024_mrv2_graph
  n_gpus_per_node: 8
  nnodes: 1
  save_freq: -1
  test_freq: -1
  val_before_train: false
  resume_mode: disable

ray_kwargs:
  ray_init:
    num_cpus: 160
